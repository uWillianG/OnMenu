services:
  web:
    build:
      context: .
      args:
        POSTGRES_CLIENT_VERSION: ${POSTGRES_CLIENT_VERSION:-17}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${SITE_DOMAIN:?Preencha SITE_DOMAIN no .env}
      BASE_URL: https://${SITE_DOMAIN}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${SITE_DOMAIN}
      DJANGO_BEHIND_PROXY: "True"
      DJANGO_SERVE_MEDIA: "True"
      DJANGO_SQLITE_PATH: /data/db.sqlite3
      DJANGO_MEDIA_ROOT: /data/media
      DJANGO_BACKUP_ROOT: /data/backups
    volumes:
      - onmenu-data:/data
    healthcheck:
      test: ["CMD", "python", "deployment/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
  operations:
    build:
      context: .
      args:
        POSTGRES_CLIENT_VERSION: ${POSTGRES_CLIENT_VERSION:-17}
    restart: unless-stopped
    command: ["operations"]
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${SITE_DOMAIN}
      BASE_URL: https://${SITE_DOMAIN}
      DJANGO_SQLITE_PATH: /data/db.sqlite3
      DJANGO_MEDIA_ROOT: /data/media
      DJANGO_BACKUP_ROOT: /data/backups
    volumes:
      - onmenu-data:/data
    depends_on:
      web:
        condition: service_healthy
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
volumes:
  onmenu-data:
  caddy-data:
  caddy-config:
